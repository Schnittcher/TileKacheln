<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
:root{
  --text:         var(--content-color,#fff);
  --text-sub:     color-mix(in srgb,var(--content-color,#fff) 55%,transparent);
  --c-ui-bg:      color-mix(in srgb,var(--content-color,#fff)  5%,transparent);
  --c-ui-border:  color-mix(in srgb,var(--content-color,#fff)  8%,transparent);
  --c-btn-bg:     color-mix(in srgb,var(--content-color,#fff)  6%,transparent);
  --c-btn-border: color-mix(in srgb,var(--content-color,#fff) 13%,transparent);
  --c-hover:      color-mix(in srgb,var(--content-color,#fff) 14%,transparent);
}

.tile{
  font-size:12px;width:100%;height:100%;position:relative;overflow:hidden;
  background:transparent;color:var(--text,#fff);
  padding:1em 1em 0.75em;
  box-shadow:0 4px 20px rgba(0,0,0,.45);
  display:flex;flex-direction:column;
}
.tile::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--accent,#2196F3);transition:background .3s;
}

/* ── Header ─────────────────────────────────────────── */
.header{display:flex;align-items:center;margin-bottom:0.5em}
.tile-name{
  font-size:1.08em;font-weight:500;color:var(--text-sub);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}

/* ── Steuer-Zeilen ───────────────────────────────────── */
.ctrl-rows{display:flex;flex-direction:column;gap:0.4em;margin-bottom:0.5em;}
.ctrl-row{display:flex;align-items:center;justify-content:center;gap:0.5em;}
.ctrl-btn{
  width:2.6em;height:2.6em;border-radius:50%;flex-shrink:0;font-size:inherit;
  border:1px solid var(--c-btn-border);background:var(--c-btn-bg);
  color:var(--text-sub);cursor:pointer;outline:none;
  display:none;align-items:center;justify-content:center;
  transition:background .15s,color .15s,border-color .15s;
}
.ctrl-btn:hover{background:var(--c-hover);color:var(--text)}
.ctrl-btn:active{transform:scale(.88)}
#power-btn.visible{display:flex}
#power-btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
#silent-btn.visible{display:flex}
#silent-btn.on{border-color:var(--accent-sel);color:var(--accent-sel);background:var(--accent-sel-bg)}
#settings-btn.visible{display:flex}

/* ── Ist-Temperatur (groß) ───────────────────────────── */
.current-temp-area{
  flex:1;min-height:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  margin:0.25em 0 0;
}
.current-temp-val{
  font-size:var(--temp-size,4em);font-weight:200;
  line-height:1.1;letter-spacing:-0.05em;white-space:nowrap;
}

/* ── Info-Bar (Außentemp, Feuchte, Leistung) ─────────── */
.info-bar{
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:0.25em 0.9em;margin-bottom:0.3em;
  font-size:0.82em;
}
.info-item{display:flex;align-items:center;gap:0.28em;color:var(--text-sub);}
.info-item span{font-weight:500;color:var(--text);}
.info-icon{
  width:0.85em;height:0.85em;flex:0 0 auto;
  stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
}

/* ── Soll-Temperatur-Steuerung ──────────────────────── */
.sp-label{
  font-size:0.92em;color:var(--text-sub);text-align:center;
  margin-bottom:0.33em;text-transform:uppercase;letter-spacing:.5px;
}
.setpoint-control{
  display:flex;align-items:center;justify-content:center;gap:0.75em;
  padding:0.42em 0.67em;background:var(--c-ui-bg);
  border-radius:0.67em;border:1px solid var(--c-ui-border);
}
.sp-btn{
  width:2em;aspect-ratio:1;border-radius:50%;
  border:1px solid var(--c-btn-border);background:var(--c-btn-bg);
  color:var(--text);font-size:1.33em;line-height:1;cursor:pointer;
  transition:background .15s,transform .1s;outline:none;
  display:flex;align-items:center;justify-content:center;
}
.sp-btn:hover{background:var(--c-hover)}
.sp-btn:active{transform:scale(.88)}
.sp-btn.hidden{visibility:hidden;pointer-events:none}
.setpoint-control.readonly .sp-btn{display:none}
.setpoint-control.readonly{justify-content:center}
.sp-val{font-size:1.67em;font-weight:300;min-width:3em;text-align:center;white-space:nowrap;}

/* ── Modus-Icon-Buttons (in ctrl-row) ───────────────── */
.mode-icon-btns{display:flex;gap:0.4em;align-items:center;}
.mode-icon-btn{
  width:2.6em;height:2.6em;border-radius:50%;
  border:1px solid var(--c-btn-border);background:var(--c-btn-bg);
  color:var(--text-sub);cursor:pointer;outline:none;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s,border-color .15s;
  font-size:1em;
}
.mode-icon-btn:hover{background:var(--c-hover);color:var(--text)}
.mode-icon-btn:active{transform:scale(.88)}
.mode-icon-btn.active{
  border-color:var(--accent-sel);color:var(--accent-sel);background:var(--accent-sel-bg);
}
.ctrl-sep{
  width:1px;height:1.4em;background:var(--c-btn-border);flex:0 0 auto;
}

/* ── Sektion-Label ───────────────────────────────────── */
.section-label{
  font-size:0.85em;color:var(--text-sub);text-transform:uppercase;
  letter-spacing:.5px;margin-top:0.5em;margin-bottom:0.25em;
}

/* ── Option-Buttons (Lüfter) ─────────────────────────── */
.opt-btn{
  flex:1 1 auto;padding:0.42em 0.75em;border-radius:0.5em;
  border:1px solid var(--c-ui-border);background:var(--c-ui-bg);
  color:var(--text-sub);font-size:1em;cursor:pointer;outline:none;
  transition:all .15s;white-space:nowrap;
}
.opt-btn:hover{background:var(--c-hover);color:var(--text)}
.opt-btn.active{
  border-color:var(--accent-sel);color:var(--accent-sel);background:var(--accent-sel-bg);
}
.opt-row{display:flex;gap:0.33em;flex-wrap:wrap;justify-content:center;margin-top:0.5em}

/* ── Info-Chips ──────────────────────────────────────── */
.info-strip{display:flex;flex-wrap:wrap;gap:0.4em;margin-top:0.4em;}
.info-chip{
  flex:1 1 auto;min-width:0;
  padding:0.3em 0.6em;
  background:var(--c-ui-bg);
  border-radius:0.6em;
  border:1px solid var(--c-ui-border);
}
.info-chip-label{
  font-size:0.68em;text-transform:uppercase;letter-spacing:.5px;
  color:var(--text-sub);margin-bottom:0.1em;white-space:nowrap;
}
.info-chip-value{
  font-size:0.95em;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ── Popup-Overlay ───────────────────────────────────── */
.popup{
  position:absolute;inset:0;z-index:20;
  background:rgba(0,0,0,.85);
  display:flex;flex-direction:column;
  padding:0.85em 1em 0.9em;
  visibility:hidden;opacity:0;
  transition:opacity .18s,visibility .18s;
}
.popup.open{visibility:visible;opacity:1}
.popup-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:0.75em;
}
.popup-title{
  font-size:0.9em;font-weight:500;color:var(--text-sub);
  text-transform:uppercase;letter-spacing:.5px;
}
.popup-close{
  width:1.7em;height:1.7em;border-radius:50%;
  border:1px solid var(--c-btn-border);background:var(--c-btn-bg);
  color:var(--text);cursor:pointer;outline:none;font-size:1em;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.popup-close:hover{background:var(--c-hover)}
.popup-close:active{transform:scale(.88)}
.popup-body{
  display:flex;flex-direction:column;gap:0.75em;
  overflow-y:auto;flex:1;min-height:0;
}
</style>

<div id="tile" class="tile">

  <div id="info-bar" class="info-bar">
    <div class="info-item" id="info-outdoor" style="display:none">

                   1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33
                   l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0
                   1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06
                   A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51
                   1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9

      <div id="popup-fan-section" style="display:none">

      </div>
    </div>

</div>

<script>
var _currentTarget = null;
var _currentStatus = null;
var _currentSilent = null;
var _compactMode   = false;
var _lastData      = null;

// ── Responsive Skalierung ───────────────────────────────
var _base = 12;
(function(){
  if(typeof ResizeObserver === 'undefined') return;
  var t    = document.getElementById('tile');
  var area = document.getElementById('current-temp-area');

  // Tile-Observer: Basis-Schriftgröße + Compact-Check
  new ResizeObserver(function(e){
    var bs = e[0].borderBoxSize && e[0].borderBoxSize[0];
    var w  = bs ? bs.inlineSize : t.offsetWidth;
    var h  = bs ? bs.blockSize  : t.offsetHeight;
    _base  = Math.max(10, Math.min(20, Math.min(w,h) / 17.5));
    t.style.fontSize = _base.toFixed(2) + 'px';
    if(_lastData) checkCompact(false);
    updateTempSize();
  }).observe(t);

  // Bereichs-Observer: Temperatur-Schriftgröße wenn Höhe sich ändert
  new ResizeObserver(function(){
    updateTempSize();
  }).observe(area);
})();

function updateTempSize(){
  var area = document.getElementById('current-temp-area');
  if(!area) return;
  var dh = area.offsetHeight;
  var px = dh > 0 ? Math.max(_base*2, Math.min(_base*3.5, dh*0.55)) : _base*2;
  document.getElementById('tile').style.setProperty('--temp-size', (px/_base).toFixed(3) + 'em');
}

// ── Compact-Mode-Erkennung ──────────────────────────────
// Schwelle: Buttons nehmen > 48 % der Kachelhöhe ein → Popup.
// Breiter ziehen reduziert Umbrüche → kleineres Verhältnis → Buttons erscheinen wieder.
// Hysterese: Einstieg > 48 %, Ausstieg < 38 % (kein Flackern an der Grenze).
var COMPACT_ENTER = 0.48;
var COMPACT_EXIT  = 0.38;

function checkCompact(forceEnterThreshold){
  if(!_lastData) return;
  var hasAirDist = _lastData.airDistributionOptions && _lastData.airDistributionOptions.length > 0;
  var hasFan     = _lastData.fanSpeedOptions && _lastData.fanSpeedOptions.length > 0;
  if(!hasAirDist && !hasFan){ applyCompact(false); return; }

  var a = document.getElementById('airdist-section');
  var f = document.getElementById('fan-section');
  var t = document.getElementById('tile');

  if(hasAirDist) a.style.removeProperty('display');
  if(hasFan)     f.style.removeProperty('display');

  var tileH    = t.offsetHeight;
  var sectionH = (hasAirDist ? a.offsetHeight : 0) + (hasFan ? f.offsetHeight : 0);
  var areaH    = document.getElementById('current-temp-area').offsetHeight;

  if(_compactMode){
    if(hasAirDist) a.style.display = 'none';
    if(hasFan)     f.style.display = 'none';
  }

  var ratio     = tileH > 0 ? sectionH / tileH : 1;
  var threshold = (forceEnterThreshold || !_compactMode) ? COMPACT_ENTER : COMPACT_EXIT;
  applyCompact(ratio > threshold || areaH < _base * 2.5);
}

function applyCompact(compact){
  if(_compactMode === compact) return;
  _compactMode = compact;
  var d          = _lastData || {};
  var hasAirDist = d.airDistributionOptions && d.airDistributionOptions.length > 0;
  var hasFan     = d.fanSpeedOptions && d.fanSpeedOptions.length > 0;
  var a          = document.getElementById('airdist-section');
  var f          = document.getElementById('fan-section');
  var btn        = document.getElementById('settings-btn');

  if(compact){
    if(hasAirDist) a.style.display = 'none';
    if(hasFan)     f.style.display = 'none';
    btn.classList.add('visible');
  } else {
    if(hasAirDist) a.style.removeProperty('display');
    if(hasFan)     f.style.removeProperty('display');
    btn.classList.remove('visible');
    closePopup();
  }
  updateTempSize();
}

// ── Popup ───────────────────────────────────────────────
function openPopup(){
  if(!_lastData) return;
  renderOptions('popup-airdist-section','popup-airdist-btns',
                _lastData.airDistributionOptions, _lastData.airDistribution, 'SetAirDistribution');
  renderOptions('popup-fan-section','popup-fan-btns',
                _lastData.fanSpeedOptions, _lastData.fanSpeed, 'SetFanSpeed');
  document.getElementById('popup').classList.add('open');
}

function closePopup(){
  document.getElementById('popup').classList.remove('open');
}

// ── Farbe ───────────────────────────────────────────────
function intToHex(n){ return '#' + ('000000' + n.toString(16)).slice(-6) }

function togglePower(){
  if(_currentStatus === null) return;
  _currentStatus = !_currentStatus;
  document.getElementById('power-btn').classList.toggle('on', _currentStatus);
  if(typeof requestAction !== 'undefined') requestAction('SetStatus', _currentStatus);
}

function toggleSilent(){
  if(_currentSilent === null) return;
  _currentSilent = !_currentSilent;
  document.getElementById('silent-btn').classList.toggle('on', _currentSilent);
  if(typeof requestAction !== 'undefined') requestAction('SetSilentMode', _currentSilent);
}

function applyAccent(colorInt, useSymcon, isOn, colorOnInt){
  var t = document.getElementById('tile');
  if(useSymcon){
    // Aktive Buttons immer in voller Akzentfarbe (unabhängig von AN/AUS)
    t.style.setProperty('--accent-sel',    'var(--accent-color,#2196F3)');
    t.style.setProperty('--accent-sel-bg', 'color-mix(in srgb,var(--accent-color,#2196F3) 15%,transparent)');
    if(isOn === false){
      // Power-Button & Tile-Akzent gedimmt wenn AUS
      t.style.setProperty('--accent',    'color-mix(in srgb,var(--content-color,#fff) 35%,transparent)');
      t.style.setProperty('--accent-fg', 'color-mix(in srgb,var(--content-color,#fff) 35%,transparent)');
      t.style.setProperty('--accent-bg', 'color-mix(in srgb,var(--content-color,#fff)  8%,transparent)');
    } else {
      t.style.setProperty('--accent',    'var(--accent-color,#2196F3)');
      t.style.setProperty('--accent-fg', 'var(--accent-color,#2196F3)');
      t.style.setProperty('--accent-bg', 'color-mix(in srgb,var(--accent-color,#2196F3) 15%,transparent)');
    }
  } else {
    var r = (colorInt >> 16) & 0xff;
    var g = (colorInt >>  8) & 0xff;
    var b =  colorInt        & 0xff;
    t.style.setProperty('--accent',    intToHex(colorInt));
    t.style.setProperty('--accent-fg', intToHex(colorInt));
    t.style.setProperty('--accent-bg', 'rgba('+r+','+g+','+b+',.15)');
    // Aktive Buttons immer in der "AN"-Farbe
    var on = colorOnInt || colorInt;
    var ro = (on >> 16) & 0xff, go = (on >> 8) & 0xff, bo = on & 0xff;
    t.style.setProperty('--accent-sel',    intToHex(on));
    t.style.setProperty('--accent-sel-bg', 'rgba('+ro+','+go+','+bo+',.15)');
  }
}

// ── Daten empfangen ─────────────────────────────────────
function handleMessage(jsonStr){
  var d = JSON.parse(jsonStr);
  _lastData = d;
  var colors   = d.colors || {};
  var colorOn  = colors.on  || 2201331;
  var colorOff = colors.off || 10066329;

  var useSymcon = d.useSymconColors !== false;
  var statusKnown = d.status !== null && d.status !== undefined;
  applyAccent(statusKnown ? (d.status ? colorOn : colorOff) : colorOn,
              useSymcon,
              statusKnown ? d.status : null,
              colorOn);

  // Power-Button
  var pb = document.getElementById('power-btn');
  if(d.status !== null && d.status !== undefined){
    _currentStatus = d.status;
    pb.classList.add('visible');
    pb.classList.toggle('on', d.status);
  } else {
    _currentStatus = null;
    pb.classList.remove('visible');
  }

  // Silent-Button
  var sb = document.getElementById('silent-btn');
  if(d.silentMode !== null && d.silentMode !== undefined){
    _currentSilent = d.silentMode;
    sb.classList.add('visible');
    sb.classList.toggle('on', d.silentMode);
    sb.disabled = (d.silentModeEditable === false);
  } else {
    _currentSilent = null;
    sb.classList.remove('visible');
  }

  document.getElementById('tile-name').textContent = d.name || '';

  // Ist-Temperatur
  var ctv = document.getElementById('current-temp-val');
  if(d.currentTemp !== null && d.currentTemp !== undefined){
    ctv.textContent    = parseFloat(d.currentTemp).toFixed(1) + '°';
    ctv.style.visibility = 'visible';
  } else {
    ctv.style.visibility = 'hidden';
  }

  // Soll-Temperatur
  var ta = document.getElementById('temp-area');
  if(d.targetTemp !== null && d.targetTemp !== undefined){
    _currentTarget = parseFloat(d.targetTemp);
    document.getElementById('temp-val').textContent = _currentTarget.toFixed(1) + '°';
    ta.style.removeProperty('display');
    var editable = d.targetTempEditable !== false;
    var spCtrl   = document.querySelector('#temp-area .setpoint-control');
    if(spCtrl) spCtrl.classList.toggle('readonly', !editable);
    document.getElementById('temp-minus').classList.toggle('hidden', !editable);
    document.getElementById('temp-plus').classList.toggle('hidden', !editable);
  } else {
    ta.style.display = 'none';
  }

  // Modus als Icons in ctrl-row
  renderModeIcons(d.modusOptions, d.modus);

  // Luftverteilung + Lüfter (inline) – erst zeigen, dann Compact-Check
  renderOptions('airdist-section', 'airdist-btns', d.airDistributionOptions, d.airDistribution, 'SetAirDistribution');
  renderOptions('fan-section',     'fan-btns',     d.fanSpeedOptions, d.fanSpeed, 'SetFanSpeed');

  // Popup aktualisieren falls gerade offen
  if(document.getElementById('popup').classList.contains('open')){
    renderOptions('popup-airdist-section','popup-airdist-btns',
                  d.airDistributionOptions, d.airDistribution, 'SetAirDistribution');
    renderOptions('popup-fan-section','popup-fan-btns',
                  d.fanSpeedOptions, d.fanSpeed, 'SetFanSpeed');
  }

  // Seiten-Stats um die Temperatur
  function fmtNum(v, sfx){ return v===null||v===undefined ? null : v+(sfx&&sfx.charAt(0)==='°'?'':' ')+(sfx||''); }
  function setInfoItem(id, show, val){
    var el = document.getElementById(id);
    el.style.display = show ? '' : 'none';
    if(show && val !== null) document.getElementById(id+'-val').textContent = val;
  }

  var hasOutdoor = d.outdoorTemp     !== null && d.outdoorTemp     !== undefined;
  var hasHumIn   = d.humidityIndoor  !== null && d.humidityIndoor  !== undefined;
  var hasHumOut  = d.humidityOutdoor !== null && d.humidityOutdoor !== undefined;
  var hasPower   = d.power           !== null && d.power           !== undefined;

  setInfoItem('info-outdoor', hasOutdoor, fmtNum(d.outdoorTemp, d.outdoorTempSuffix||'°C'));

  var humVal = null;
  if(hasHumIn && hasHumOut){
    humVal = d.humidityIndoor+' '+(d.humidityIndoorSuffix||'%')+' / '+d.humidityOutdoor+' '+(d.humidityOutdoorSuffix||'%');
  } else if(hasHumIn){
    humVal = fmtNum(d.humidityIndoor, d.humidityIndoorSuffix||'%');
  } else if(hasHumOut){
    humVal = fmtNum(d.humidityOutdoor, d.humidityOutdoorSuffix||'%');
  }
  setInfoItem('info-humidity', hasHumIn||hasHumOut, humVal);
  setInfoItem('info-power', hasPower, fmtNum(d.power, d.powerSuffix||'W'));

  // Compact-Status neu bestimmen (forceEnterThreshold=true für saubere Neubewertung)
  _compactMode = false;
  document.getElementById('settings-btn').classList.remove('visible');
  checkCompact(true);

  updateTempSize();
}

  cool: '<path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07"/>',

  dry:  '<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>',
  fan:  '<path d="M9.59 4.59A2 2 0 1 1 11 8H2"/><path d="M11.59 19.41A2 2 0 1 0 13 16H2"/><path d="M16.27 3.73A2.5 2.5 0 1 1 18.5 8H2"/>'
};

function _getModeIcon(label){
  var l = (label||'').toLowerCase();
  if(/kühl|cool|kalt/.test(l))       return _MI.cool;
  if(/heiz|heat|warm|wärm/.test(l))  return _MI.heat;
  if(/auto/.test(l))                  return _MI.auto;
  if(/trock|dry/.test(l))            return _MI.dry;
  if(/lüft|fan|vent/.test(l))        return _MI.fan;
  return null;
}

function renderModeIcons(options, current){
  var c   = document.getElementById('mode-icon-btns');
  var row = document.getElementById('ctrl-row-2');
  c.innerHTML = '';
  if(!options || options.length === 0){ row.style.display = 'none'; return; }
  row.style.removeProperty('display');
  options.forEach(function(opt){
    var btn = document.createElement('button');
    btn.className = 'mode-icon-btn' + (opt.value === current ? ' active' : '');
    btn.title = opt.label;
    var iconPath = _getModeIcon(opt.label);
    if(iconPath){
      btn.innerHTML = '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none"'
        + ' stroke="currentColor" stroke-width="2.2" stroke-linecap="round"'
        + ' stroke-linejoin="round" style="pointer-events:none">' + iconPath + '</svg>';
    } else {
      btn.textContent = opt.label.substring(0, 2);
      btn.style.fontSize = '0.78em';
      btn.style.fontWeight = '500';
    }
    btn.onclick = (function(v){
      return function(){
        c.querySelectorAll('.mode-icon-btn').forEach(function(b){ b.classList.remove('active') });
        btn.classList.add('active');
        if(typeof requestAction !== 'undefined') requestAction('SetModus', v);
      };
    })(opt.value);
    c.appendChild(btn);
  });
}

function renderOptions(sectionId, rowId, options, current, action){
  var section = document.getElementById(sectionId);
  var row     = document.getElementById(rowId);
  if(!options || options.length === 0){ section.style.display = 'none'; return; }
  section.style.removeProperty('display');
  row.innerHTML = '';
  options.forEach(function(opt){
    var btn = document.createElement('button');
    btn.className = 'opt-btn' + (opt.value === current ? ' active' : '');
    btn.textContent = opt.label;
    btn.onclick = (function(v, a, r){
      return function(){
        r.querySelectorAll('.opt-btn').forEach(function(b){ b.classList.remove('active') });
        btn.classList.add('active');
        if(typeof requestAction !== 'undefined') requestAction(a, v);
      };
    })(opt.value, action, row);
    row.appendChild(btn);
  });
}

function adjustTemp(dir){
  if(_currentTarget === null) return;
  var cfg  = typeof _config !== 'undefined' ? _config : {min:16, max:30, step:0.5};
  var next = Math.round((_currentTarget + dir * cfg.step) * 10) / 10;
  if(next < cfg.min || next > cfg.max) return;
  _currentTarget = next;
  document.getElementById('temp-val').textContent = next.toFixed(1) + '°';
  if(typeof requestAction !== 'undefined') requestAction('SetTargetTemp', next);
}
