<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
:root{
  --text:         var(--content-color,#fff);
  --text-sub:     color-mix(in srgb,var(--content-color,#fff) 55%,transparent);
  --c-border:     color-mix(in srgb,var(--content-color,#fff) 20%,transparent);
  --c-bg:         color-mix(in srgb,var(--content-color,#fff)  7%,transparent);
  --c-ui-bg:      color-mix(in srgb,var(--content-color,#fff)  5%,transparent);
  --c-ui-border:  color-mix(in srgb,var(--content-color,#fff)  8%,transparent);
  --c-btn-bg:     color-mix(in srgb,var(--content-color,#fff)  6%,transparent);
  --c-btn-border: color-mix(in srgb,var(--content-color,#fff) 13%,transparent);
  --c-hover:      color-mix(in srgb,var(--content-color,#fff) 14%,transparent);
}

.tile{
  font-size:12px;
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:transparent;
  color:var(--text,#fff);
  padding:1em 1em 0.75em;
  box-shadow:0 4px 20px rgba(0,0,0,.45);
  display:flex;
  flex-direction:column;
}
.tile::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--accent,#444);transition:background .3s;
}

.dark-header{
  display:flex;align-items:center;
  margin-bottom:0.5em;
}
.dark-tile-name{
  font-size:1.08em;font-weight:500;color:var(--text-sub,#8C9BAB);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-width:0;/* erlaubt Schrumpfen im Flex-Container */
}

.dark-temp-display{
  text-align:center;margin:0.25em 0 0.5em;
  flex:1;min-height:0;overflow:visible;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.dark-current-temp{font-size:var(--temp-size,4em);font-weight:200;line-height:1.1;letter-spacing:-0.05em;white-space:nowrap;}
.dark-humidity{
  display:flex;align-items:center;justify-content:center;
  gap:0.33em;font-size:1.08em;color:#6DB3F2;margin-top:0.42em;
}
.hum-icon{width:1em;height:1em;fill:#6DB3F2}

.sp-label{
  font-size:0.92em;color:var(--text-sub,#8C9BAB);text-align:center;
  margin-bottom:0.33em;text-transform:uppercase;letter-spacing:.5px;
}
.setpoint-control{
  display:flex;align-items:center;justify-content:center;gap:0.75em;
  padding:0.42em 0.67em;background:var(--c-ui-bg);
  border-radius:0.67em;border:1px solid var(--c-ui-border);
}
.sp-btn{
  width:2em;aspect-ratio:1;border-radius:50%;
  border:1px solid var(--c-btn-border);background:var(--c-btn-bg);
  color:var(--text,#fff);font-size:1.33em;line-height:1;cursor:pointer;
  transition:background .15s,transform .1s;outline:none;
  display:flex;align-items:center;justify-content:center;
}
.sp-btn:hover{background:var(--c-hover)}
.sp-btn:active{transform:scale(.88)}
.sp-val{font-size:1.67em;font-weight:300;min-width:3em;text-align:center}
.setpoint-control.readonly .sp-btn{display:none}
.setpoint-control.readonly{justify-content:center}

/* ── Ventilposition ─────────────────────────────────── */
.valve-row{
  display:flex;align-items:center;gap:0.5em;
  margin-top:0.42em;width:100%;
}
.valve-label{
  font-size:0.85em;color:var(--text-sub,#8C9BAB);
  white-space:nowrap;flex-shrink:0;width:3em;
}
.valve-slider{
  flex:1;min-width:0;-webkit-appearance:none;appearance:none;
  height:0.4em;border-radius:0.25em;outline:none;cursor:pointer;
  background:linear-gradient(to right,
    var(--accent,#444) 0%,
    var(--accent,#444) var(--vp,0%),
    var(--c-ui-bg) var(--vp,0%),
    var(--c-ui-bg) 100%);
  border:1px solid var(--c-ui-border);
}
.valve-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:1em;height:1em;border-radius:50%;
  background:var(--text,#fff);
  border:2px solid var(--accent,#444);
  cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.valve-slider::-moz-range-thumb{
  width:1em;height:1em;border-radius:50%;
  background:var(--text,#fff);
  border:2px solid var(--accent,#444);
  cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.valve-slider:disabled{opacity:0.45;cursor:default;pointer-events:none;}
.valve-pct{
  font-size:0.92em;font-weight:300;
  white-space:nowrap;flex-shrink:0;min-width:2.5em;text-align:right;
}
.valve-numeric{flex:1;min-width:0;display:flex;align-items:center;gap:0.5em;}
.valve-toggle{
  flex:1;padding:0.3em 0.75em;border-radius:1em;text-align:center;
  border:1px solid var(--c-btn-border);background:var(--c-btn-bg);
  color:var(--text-sub,#8C9BAB);font-size:0.92em;cursor:pointer;outline:none;
  transition:background .2s,border-color .2s,color .2s;
}
.valve-toggle.on{
  background:var(--accent-bg);border-color:var(--accent);color:var(--accent);
}
.valve-toggle.readonly{cursor:default;pointer-events:none;}

.mode-buttons{display:flex;gap:0.33em;margin-top:0.5em;justify-content:center;flex-wrap:wrap}
.mode-btn{
  padding:0.42em 0.75em;border-radius:0.5em;
  border:1px solid var(--c-ui-border);background:var(--c-ui-bg);
  color:var(--text-sub,#8C9BAB);font-size:1em;cursor:pointer;
  transition:all .15s;outline:none;
}
.mode-btn:hover{background:var(--c-hover);color:var(--text,#fff)}
.mode-btn.active{
  border-color:var(--accent);color:var(--accent-fg);background:var(--accent-bg);
}
</style>

<div id="tile" class="tile state-idle">

  <div class="dark-header">
    <span class="dark-tile-name" id="tile-name"></span>

  </div>

  <div class="dark-temp-display" id="temp-display-area">
    <div class="dark-current-temp" id="current-temp">--&deg;</div>
    <div class="dark-humidity" id="humidity" style="display:none">
      <svg class="hum-icon" viewBox="0 0 24 24"><path d="M12 2C6 9 4 13 4 16a8 8 0 0016 0c0-3-2-7-8-14z"/></svg>
      <span id="humidity-val"></span>
    </div>
  </div>

  <div id="setpoint" style="display:none">
    <div class="sp-label">Ziel-Temperatur</div>
    <div class="setpoint-control">
      <button class="sp-btn" onclick="adjustTemp(-1)">&#8722;</button>
      <div class="sp-val" id="setpoint-val">--&deg;</div>
      <button class="sp-btn" onclick="adjustTemp(1)">&#43;</button>
    </div>
  </div>

  <div id="valve-row" class="valve-row" style="display:none">
    <span class="valve-label">Ventil</span>
    <div id="valve-numeric" class="valve-numeric">
      <input type="range" class="valve-slider" id="valve-slider"
             min="0" max="100" step="1" value="0"
             oninput="onValveInput(this.value)"
             onchange="sendValve(this.value)">
      <span class="valve-pct" id="valve-pct">0%</span>
    </div>
    <button id="valve-toggle" class="valve-toggle" style="display:none"
            onclick="sendValveBool()">--</button>
  </div>

  <div class="mode-buttons" id="mode-buttons"></div>

</div>

<script>
var _currentTarget  = null;
var _valveBoolState = false;
var _config = {min: 5, max: 30, step: 0.5};

// ── Responsive Skalierung ───────────────────────────────────────────────────
(function(){
  if(typeof ResizeObserver==='undefined')return;
  var t=document.getElementById('tile');
  new ResizeObserver(function(e){
    var bs=e[0].borderBoxSize&&e[0].borderBoxSize[0];
    var w=bs?bs.inlineSize:t.offsetWidth;
    var h=bs?bs.blockSize:t.offsetHeight;
    var base=Math.max(10,Math.min(20,Math.min(w,h)/17.5));
    t.style.fontSize=base.toFixed(2)+'px';

    // Temperatur-Schriftgröße an verfügbare Höhe des flex:1-Containers anpassen
    var disp=document.getElementById('temp-display-area');
    if(disp){
      var dh=disp.offsetHeight;
      // Abzug für Humidity-Zeile (wenn sichtbar)
      var hum=document.getElementById('humidity');
      if(hum&&hum.style.display!=='none') dh=Math.max(0,dh-hum.offsetHeight-6);
      var tempPx=Math.max(base*2, Math.min(base*5.5, dh*0.55));
      t.style.setProperty('--temp-size', (tempPx/base).toFixed(3)+'em');
    }
  }).observe(t);
})();

// ── Hilfsfunktionen ──────────────────────────────────────────────────────────
function intToHex(n) {
  return '#' + ('000000' + n.toString(16)).slice(-6);
}

function applyAccent(colorInt, useSymcon, modeClass) {
  var tile = document.getElementById("tile");
  if (useSymcon) {
    var isActive = (modeClass !== 'state-off' && modeClass !== 'state-idle');
    if (isActive) {
      tile.style.setProperty('--accent',    'var(--accent-color,#FF6B00)');
      tile.style.setProperty('--accent-fg', 'var(--accent-color,#FF6B00)');
      tile.style.setProperty('--accent-bg', 'color-mix(in srgb,var(--accent-color,#FF6B00) 15%,transparent)');
    } else {
      tile.style.setProperty('--accent',    'color-mix(in srgb,var(--content-color,#fff) 35%,transparent)');
      tile.style.setProperty('--accent-fg', 'color-mix(in srgb,var(--content-color,#fff) 35%,transparent)');
      tile.style.setProperty('--accent-bg', 'color-mix(in srgb,var(--content-color,#fff)  8%,transparent)');
    }
  } else {
    var r = (colorInt >> 16) & 0xff;
    var g = (colorInt >>  8) & 0xff;
    var b =  colorInt        & 0xff;
    var hex = intToHex(colorInt);
    tile.style.setProperty('--accent',    hex);
    tile.style.setProperty('--accent-fg', hex);
    tile.style.setProperty('--accent-bg', 'rgba(' + r + ',' + g + ',' + b + ',.15)');
  }
}

function handleMessage(jsonStr) {
  var d = JSON.parse(jsonStr);
  var modeClass = classifyMode(d.hvacMode);
  document.getElementById("tile").className = "tile " + modeClass;

  var colors = d.colors || {};
  var colorMap = {
    'state-heat': colors.heat || 16739072,
    'state-cool': colors.cool || 2201331,
    'state-auto': colors.auto || 5025616,
    'state-off':  colors.off  || 10066329,
    'state-idle': 12303291
  };
  var useSymcon = d.useSymconColors !== false;
  applyAccent(colorMap[modeClass] || 12303291, useSymcon, modeClass);

  var tile = document.getElementById("tile");

  // Config übernehmen (Sollwert-Grenzen)
  if (d.config) {
    _config.min  = d.config.min  != null ? d.config.min  : _config.min;
    _config.max  = d.config.max  != null ? d.config.max  : _config.max;
    _config.step = d.config.step != null ? d.config.step : _config.step;
  }

  document.getElementById("tile-name").textContent = d.name || "";

document.getElementById("current-temp").textContent =
    d.currentTemp !== null && d.currentTemp !== undefined
      ? parseFloat(d.currentTemp).toFixed(1) + "°" : "--°";

  var humWrap = document.getElementById("humidity");
  if (d.humidity !== null && d.humidity !== undefined) {
    document.getElementById("humidity-val").textContent = Math.round(d.humidity) + "%";
    humWrap.style.display = "";
  } else {
    humWrap.style.display = "none";
  }

  var spWrap = document.getElementById("setpoint");
  if (d.targetTemp !== null && d.targetTemp !== undefined) {
    _currentTarget = parseFloat(d.targetTemp);
    document.getElementById("setpoint-val").textContent = _currentTarget.toFixed(1) + "°";
    spWrap.style.removeProperty("display");
    var spCtrl = spWrap.querySelector(".setpoint-control");
    if (d.targetTempEditable === false) {
      spCtrl.classList.add("readonly");
    } else {
      spCtrl.classList.remove("readonly");
    }
  } else {
    spWrap.style.display = "none";
  }

  var valveRow = document.getElementById("valve-row");
  if (d.valvePosition !== null && d.valvePosition !== undefined) {
    valveRow.style.removeProperty("display");
    var valveEditable = d.valveEditable !== false;
    if (d.valveType === "bool") {
      setValveBool(d.valvePosition, valveEditable);
    } else {
      var vp = Math.max(0, Math.min(100, Math.round(d.valvePosition)));
      setValveDisplay(vp, valveEditable);
    }
  } else {
    valveRow.style.display = "none";
  }

  updateModeButtons(d);
}

function setValveDisplay(vp, editable) {
  document.getElementById("valve-numeric").style.removeProperty("display");
  document.getElementById("valve-toggle").style.display = "none";
  var slider = document.getElementById("valve-slider");
  slider.value = vp;
  slider.disabled = (editable === false);
  document.getElementById("valve-pct").textContent = vp + "%";
  document.getElementById("tile").style.setProperty("--vp", vp + "%");
}

function setValveBool(state, editable) {
  document.getElementById("valve-numeric").style.display = "none";
  _valveBoolState = state;
  var btn = document.getElementById("valve-toggle");
  btn.style.removeProperty("display");
  btn.textContent = state ? "Offen" : "Zu";
  btn.className = "valve-toggle" + (state ? " on" : "") + (editable ? "" : " readonly");
}

function sendValveBool() {
  var btn = document.getElementById("valve-toggle");
  if (btn.classList.contains("readonly")) return;
  _valveBoolState = !_valveBoolState;
  btn.textContent = _valveBoolState ? "Offen" : "Zu";
  _valveBoolState ? btn.classList.add("on") : btn.classList.remove("on");
  if (typeof requestAction !== "undefined") requestAction("SetValvePosition", _valveBoolState ? 1 : 0);
}

function onValveInput(val) {
  var vp = Math.round(val);
  document.getElementById("valve-pct").textContent = vp + "%";
  document.getElementById("tile").style.setProperty("--vp", vp + "%");
}

function sendValve(val) {
  if (typeof requestAction !== "undefined") requestAction("SetValvePosition", Math.round(val));
}

function adjustTemp(dir) {
  if (_currentTarget === null) return;
  var next = Math.round((_currentTarget + dir * _config.step) * 10) / 10;
  if (next < _config.min || next > _config.max) return;
  _currentTarget = next;
  document.getElementById("setpoint-val").textContent = next.toFixed(1) + "°";
  if (typeof requestAction !== 'undefined') requestAction("SetTargetTemp", next);
}

function updateModeButtons(d) {
  var mbEl = document.getElementById("mode-buttons");
  if (!d.modeOptions || d.modeOptions.length === 0) {
    mbEl.innerHTML = "";
    return;
  }
  mbEl.innerHTML = "";
  d.modeOptions.forEach(function(opt) {
    var btn = document.createElement("button");
    btn.className = "mode-btn" + (opt.value === d.hvacMode ? " active" : "");
    btn.textContent = opt.label;
    btn.onclick = function() { if (typeof requestAction !== 'undefined') requestAction("SetHVACMode", opt.value); };
    mbEl.appendChild(btn);
  });
}

function classifyMode(mode) {
  if (mode === null || mode === undefined) return "state-idle";
  var m = String(mode).toLowerCase();
  if (["heat","heizen","1"].indexOf(m) !== -1) return "state-heat";
  if (["cool","kühlen","cooling","2"].indexOf(m) !== -1) return "state-cool";
  if (["auto","automatic","3"].indexOf(m) !== -1) return "state-auto";
  if (["off","aus","0"].indexOf(m) !== -1) return "state-off";
  return "state-idle";
}


if (typeof requestAction === 'undefined') {
  handleMessage(JSON.stringify({
    name: 'Thermostat', currentTemp: 21.5, targetTemp: 22.0, targetTempEditable: true, humidity: 48,
    valvePosition: 42, valveType: 'numeric', valveEditable: true,
    hvacMode: 'heat',
    modeOptions: [
      {value: 'heat', label: 'Heizen'}, {value: 'cool', label: 'Kühlen'},
      {value: 'auto', label: 'Auto'},   {value: 'off',  label: 'Aus'}
    ],
    config: {min: 5, max: 30, step: 0.5},
    useSymconColors: true, colors: {heat: 16739072, cool: 2201331, auto: 5025616, off: 10066329}
  }));
}
</script>
