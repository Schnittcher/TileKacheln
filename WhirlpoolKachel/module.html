<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
:root{
  --text:         var(--content-color,#fff);
  --text-sub:     color-mix(in srgb,var(--content-color,#fff) 55%,transparent);
  --c-ui-bg:      color-mix(in srgb,var(--content-color,#fff)  5%,transparent);
  --c-ui-border:  color-mix(in srgb,var(--content-color,#fff)  8%,transparent);
  --c-btn-bg:     color-mix(in srgb,var(--content-color,#fff)  6%,transparent);
  --c-btn-border: color-mix(in srgb,var(--content-color,#fff) 13%,transparent);
  --c-hover:      color-mix(in srgb,var(--content-color,#fff) 14%,transparent);
}

.tile{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  font-size:12px;
  background:transparent;
  color:var(--text,#fff);
  padding:1em 1em 0.75em;
  box-shadow:0 4px 20px rgba(0,0,0,.45);
  display:flex;
  flex-direction:column;
}
.tile::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--accent,#00B4D8);transition:background .3s;
}

.header{
  display:flex;align-items:center;
  margin-bottom:0.5em;
}
.tile-name{
  font-size:1.08em;font-weight:500;color:var(--text-sub,#8C9BAB);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-width:0;
}

/* ── Wasserbereich ───────────────────────────────── */
.water-area{
  position:relative;
  background:var(--water-bg,rgba(0,180,216,.07));
  border-radius:0.83em;
  border:1px solid var(--water-border,rgba(0,180,216,.18));
  overflow:hidden;
  margin-bottom:0.5em;
  padding:0.67em 0 0;
  flex:1;
  min-height:0;
  display:flex;align-items:center;justify-content:center;
}

/* Heizungs-Pfeile */
.heat-arrow{
  position:absolute;
  width:0.75em;height:2.2em;
  opacity:0;
  bottom:0.5em;
  overflow:visible;
}
.heat-on .heat-arrow{
  animation:heat-rise var(--dur,3s) ease-in infinite;
}
@keyframes heat-rise{
  0%  {transform:translateY(0);   opacity:0}
  12% {opacity:.6}
  80% {opacity:.25}
  100%{transform:translateY(-5.5em);opacity:0}
}

/* Bubbles */
.bubble{
  position:absolute;
  border-radius:50%;
  background:var(--accent,#00B4D8);
  opacity:0;
  bottom:1.83em;
  animation:none;
}
.bubbles-on .bubble{
  animation:bubble-rise var(--dur,2s) ease-in infinite;
}
@keyframes bubble-rise{
  0%  {transform:translateY(0);    opacity:0}
  15% {opacity:.45}
  85% {opacity:.2}
  100%{transform:translateY(-4.83em);opacity:0}
}

/* Temperatur-Anzeige */
.water-temp{
  text-align:center;
  font-size:var(--water-temp-size,3.5em);font-weight:200;
  letter-spacing:-0.05em;line-height:1.1;
  position:relative;z-index:1;
}

/* Wellenlinie unten */
.wave-wrap{
  position:absolute;bottom:0;left:0;right:0;
  height:1.83em;overflow:hidden;
}
.wave-svg{
  display:block;width:200%;height:100%;
  position:absolute;left:0;bottom:0;
}
.wave-svg path{fill:var(--accent-bg,rgba(0,180,216,.12))}
.pump-on .wave-svg{
  animation:wave-flow 2.2s linear infinite;
}
@keyframes wave-flow{
  from{transform:translateX(0)}
  to  {transform:translateX(-50%)}
}

/* ── Sollwert ────────────────────────────────────── */
.sp-label{
  font-size:0.85em;color:var(--text-sub,#8C9BAB);text-align:center;
  margin-bottom:0.25em;text-transform:uppercase;letter-spacing:.5px;
}
.setpoint-control{
  display:flex;align-items:center;justify-content:center;gap:0.67em;
  padding:0.33em 0.67em;background:var(--c-ui-bg);
  border-radius:0.67em;border:1px solid var(--c-ui-border);
  margin-bottom:0.42em;
}
.sp-btn{
  width:1.83em;aspect-ratio:1;border-radius:50%;
  border:1px solid var(--c-btn-border);background:var(--c-btn-bg);
  color:var(--text,#fff);font-size:1.25em;cursor:pointer;outline:none;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;
}
.sp-btn:hover{background:var(--c-hover)}
.sp-btn:active{transform:scale(.88)}
.sp-val{font-size:1.5em;font-weight:300;min-width:3em;text-align:center}

/* ── Leistungsanzeige ────────────────────────────── */
.power-row{
  display:flex;align-items:center;justify-content:center;gap:0.5em;
  padding:0.1em 0.25em;
  margin-bottom:0.4em;font-size:0.88em;
}
.power-icon{color:var(--accent,#00B4D8)}
.power-val{color:var(--text-sub,#8C9BAB)}
.power-sep{color:var(--text-sub,#8C9BAB);opacity:.4}
.energy-val{color:var(--text-sub,#8C9BAB)}

/* ── Toggle-Buttons ──────────────────────────────── */
.toggle-row{display:flex;gap:0.4em}
.toggle-btn{
  flex:1;padding:0.33em 0.2em;border-radius:0.67em;
  border:1px solid var(--c-ui-border);background:var(--c-ui-bg);
  color:var(--text-sub,#8C9BAB);font-size:0.88em;cursor:pointer;
  transition:all .15s;outline:none;
  display:flex;flex-direction:column;align-items:center;gap:0.15em;
  line-height:1;
}
.toggle-btn .t-icon{font-size:1.05em}
.toggle-btn:hover{background:var(--c-hover)}
.toggle-btn:active{transform:scale(.94)}
.toggle-btn.on{
  border-color:var(--btn-color,var(--accent));
  background:var(--btn-bg,var(--accent-bg));
  color:var(--btn-color,var(--accent));
}
.toggle-btn.hidden{display:none}
</style>

<div id="tile" class="tile">

  <div class="header">
    <span class="tile-name" id="tile-name"></span>
  </div>

  <!-- Wasser-Anzeige mit Blasen -->
  <div class="water-area" id="water-area">
    <div id="heat-arrows-wrap">
      <svg class="heat-arrow" style="left:8%; --dur:3.2s;animation-delay:-0.5s"  viewBox="0 0 10 34" preserveAspectRatio="none"><path d="M5,32 C1,27 9,23 5,19 C1,15 9,11 5,8" stroke="rgba(255,90,50,.7)" stroke-width="1.6" fill="none" stroke-linecap="round"/><polygon points="5,1 9,9 1,9" fill="rgba(255,90,50,.7)"/></svg>
      <svg class="heat-arrow" style="left:23%;--dur:2.8s;animation-delay:-1.4s"  viewBox="0 0 10 34" preserveAspectRatio="none"><path d="M5,32 C1,27 9,23 5,19 C1,15 9,11 5,8" stroke="rgba(255,90,50,.7)" stroke-width="1.6" fill="none" stroke-linecap="round"/><polygon points="5,1 9,9 1,9" fill="rgba(255,90,50,.7)"/></svg>
      <svg class="heat-arrow" style="left:40%;--dur:3.5s;animation-delay:-0.9s"  viewBox="0 0 10 34" preserveAspectRatio="none"><path d="M5,32 C1,27 9,23 5,19 C1,15 9,11 5,8" stroke="rgba(255,90,50,.7)" stroke-width="1.6" fill="none" stroke-linecap="round"/><polygon points="5,1 9,9 1,9" fill="rgba(255,90,50,.7)"/></svg>
      <svg class="heat-arrow" style="left:58%;--dur:3.0s;animation-delay:-2.1s"  viewBox="0 0 10 34" preserveAspectRatio="none"><path d="M5,32 C1,27 9,23 5,19 C1,15 9,11 5,8" stroke="rgba(255,90,50,.7)" stroke-width="1.6" fill="none" stroke-linecap="round"/><polygon points="5,1 9,9 1,9" fill="rgba(255,90,50,.7)"/></svg>
      <svg class="heat-arrow" style="left:76%;--dur:2.9s;animation-delay:-0.3s"  viewBox="0 0 10 34" preserveAspectRatio="none"><path d="M5,32 C1,27 9,23 5,19 C1,15 9,11 5,8" stroke="rgba(255,90,50,.7)" stroke-width="1.6" fill="none" stroke-linecap="round"/><polygon points="5,1 9,9 1,9" fill="rgba(255,90,50,.7)"/></svg>
      <svg class="heat-arrow" style="left:90%;--dur:3.3s;animation-delay:-1.7s"  viewBox="0 0 10 34" preserveAspectRatio="none"><path d="M5,32 C1,27 9,23 5,19 C1,15 9,11 5,8" stroke="rgba(255,90,50,.7)" stroke-width="1.6" fill="none" stroke-linecap="round"/><polygon points="5,1 9,9 1,9" fill="rgba(255,90,50,.7)"/></svg>
    </div>
    <div id="bubbles-wrap">
      <div class="bubble" style="left:10%;--dur:2.1s;width:5px;height:5px;animation-delay:-0.4s"></div>
      <div class="bubble" style="left:25%;--dur:1.8s;width:7px;height:7px;animation-delay:-1.1s"></div>
      <div class="bubble" style="left:44%;--dur:2.3s;width:5px;height:5px;animation-delay:-0.7s"></div>
      <div class="bubble" style="left:62%;--dur:1.9s;width:8px;height:8px;animation-delay:-1.6s"></div>
      <div class="bubble" style="left:78%;--dur:2.0s;width:5px;height:5px;animation-delay:-0.2s"></div>
      <div class="bubble" style="left:90%;--dur:2.2s;width:6px;height:6px;animation-delay:-1.3s"></div>
    </div>
    <div class="water-temp" id="water-temp">--°</div>
    <div class="wave-wrap" id="wave-wrap">
      <svg class="wave-svg" viewBox="0 0 600 22" preserveAspectRatio="none">
        <path d="M0,11 C50,2 100,20 150,11 C200,2 250,20 300,11 C350,2 400,20 450,11 C500,2 550,20 600,11 L600,22 L0,22 Z"/>
      </svg>
    </div>
  </div>

  <!-- Sollwert -->
  <div id="setpoint-wrap" style="display:none">
    <div class="sp-label">Ziel-Temperatur</div>
    <div class="setpoint-control">
      <button class="sp-btn" onclick="adjustTemp(-1)">&#8722;</button>
      <div class="sp-val" id="sp-val">--°</div>
      <button class="sp-btn" onclick="adjustTemp(1)">&#43;</button>
    </div>
  </div>

  <!-- Leistungsanzeige -->
  <div id="power-row" class="power-row" style="display:none">
    <span class="power-icon">&#9889;</span>
    <span id="power-val" class="power-val">--</span>
    <span id="energy-sep" class="power-sep" style="display:none">·</span>
    <span id="energy-val" class="energy-val" style="display:none">--</span>
  </div>

  <!-- Toggle-Buttons -->
  <div class="toggle-row">
    <button class="toggle-btn hidden" id="btn-bubbles" onclick="toggleSwitch('Bubbles')">
      <span class="t-icon">&#x2248;</span>
      <span>Blasen</span>
    </button>
    <button class="toggle-btn hidden" id="btn-pump" onclick="toggleSwitch('Pump')">
      <span class="t-icon">&#x21BA;</span>
      <span>Pumpe</span>
    </button>
    <button class="toggle-btn hidden" id="btn-heating" onclick="toggleSwitch('Heating')">
      <span class="t-icon">&#x25D1;</span>
      <span>Heizung</span>
    </button>
  </div>

</div>

<script>
(function(){
  if(typeof ResizeObserver==='undefined')return;
  var t=document.getElementById('tile');
  new ResizeObserver(function(e){
    var bs=e[0].borderBoxSize&&e[0].borderBoxSize[0];
    var w=bs?bs.inlineSize:t.offsetWidth;
    var h=bs?bs.blockSize:t.offsetHeight;
    // Schriftgröße nur von der Höhe ableiten → Steuerelemente
    // behalten bei jeder Breite dieselbe vertikale Proportion
    // Höhe treibt die Basis, Breite verhindert Überlauf bei schmalen Kacheln
    var base=Math.max(10,Math.min(20,h/18,w/15));
    t.style.fontSize=base.toFixed(2)+'px';

    // Wassertemperatur: wie ThermostatKachel, aber auch Breite begrenzt
    var wa=document.getElementById('water-area');
    if(wa){
      var wh=wa.offsetHeight;
      var maxByWidth=wa.offsetWidth*0.32; // "25.0°" hat ~5 Zeichen → passt sicher
      var px=Math.max(base*2,Math.min(base*5.5,wh*0.55,maxByWidth));
      t.style.setProperty('--water-temp-size',(px/base).toFixed(3)+'em');
    }
  }).observe(t);
})();

var _targetTemp = null;
var _bubblesOn  = null;
var _pumpOn     = null;
var _heatingOn  = null;
var _config     = {min:0, max:100, step:0.5};

function intToHex(n){
  return '#'+('000000'+n.toString(16)).slice(-6);
}

function setButtonColor(id, colorInt){
  var btn=document.getElementById(id);
  if(!btn)return;
  var r=(colorInt>>16)&0xff;
  var g=(colorInt>>8)&0xff;
  var b=colorInt&0xff;
  btn.style.setProperty('--btn-color', intToHex(colorInt));
  btn.style.setProperty('--btn-bg',    'rgba('+r+','+g+','+b+',.18)');
}

function handleMessage(jsonStr){
  var d=JSON.parse(jsonStr);
  var colors=d.colors||{};
  var accentInt=colors.accent||46296;
  var r=(accentInt>>16)&0xff;
  var g=(accentInt>>8)&0xff;
  var b=accentInt&0xff;

  var tile=document.getElementById('tile');
  tile.style.setProperty('--accent',      intToHex(accentInt));
  tile.style.setProperty('--accent-bg',   'rgba('+r+','+g+','+b+',.15)');
  tile.style.setProperty('--water-bg',    'rgba('+r+','+g+','+b+',.07)');
  tile.style.setProperty('--water-border','rgba('+r+','+g+','+b+',.2)');

  document.getElementById('tile-name').textContent=d.name||'';

  // Button-Farben
  setButtonColor('btn-bubbles', colors.bubbles || accentInt);
  setButtonColor('btn-pump',    colors.pump    || 2201331);
  setButtonColor('btn-heating', colors.heating || 16739072);

  // Config
  if(d.config){
    _config.min  = d.config.min  != null ? d.config.min  : _config.min;
    _config.max  = d.config.max  != null ? d.config.max  : _config.max;
    _config.step = d.config.step != null ? d.config.step : _config.step;
  }

  // Wassertemperatur
  if(d.currentTemp !== null && d.currentTemp !== undefined){
    document.getElementById('water-temp').textContent=d.currentTemp.toFixed(1)+'°';
  } else {
    document.getElementById('water-temp').textContent='--°';
  }

  // Sollwert
  var spWrap=document.getElementById('setpoint-wrap');
  if(d.targetTemp !== null && d.targetTemp !== undefined){
    _targetTemp=parseFloat(d.targetTemp);
    // Sicherstellen dass der aktuelle Wert innerhalb der Grenzen liegt
    if(_targetTemp < _config.min) _config.min = Math.floor(_targetTemp);
    if(_targetTemp > _config.max) _config.max = Math.ceil(_targetTemp);
    document.getElementById('sp-val').textContent=_targetTemp.toFixed(1)+'°';
    spWrap.style.removeProperty('display');
  } else {
    spWrap.style.display='none';
  }

  // Leistung
  var powerRow=document.getElementById('power-row');
  if(d.power !== null && d.power !== undefined){
    document.getElementById('power-val').textContent =
      (d.powerPrefix ? d.powerPrefix + ' ' : '') + d.power + (d.powerUnit ? ' ' + d.powerUnit : '');
    powerRow.style.removeProperty('display');
  } else {
    powerRow.style.display='none';
  }

  var energySep = document.getElementById('energy-sep');
  var energyVal = document.getElementById('energy-val');
  if(d.energy !== null && d.energy !== undefined){
    energyVal.textContent =
      (d.energyPrefix ? d.energyPrefix + ' ' : '') + d.energy + (d.energyUnit ? ' ' + d.energyUnit : '');
    energySep.style.removeProperty('display');
    energyVal.style.removeProperty('display');
  } else {
    energySep.style.display='none';
    energyVal.style.display='none';
  }

  // Schalter
  _bubblesOn=d.bubblesOn;
  _pumpOn   =d.pumpOn;
  _heatingOn=d.heatingOn;

  applySwitch('btn-bubbles',d.bubblesOn);
  applySwitch('btn-pump',   d.pumpOn);
  applySwitch('btn-heating',d.heatingOn);

  var wrap=document.getElementById('bubbles-wrap');
  wrap.className=(d.bubblesOn===true)?'bubbles-on':'';

  var heatWrap=document.getElementById('heat-arrows-wrap');
  heatWrap.className=(d.heatingOn===true)?'heat-on':'';

  var waveWrap=document.getElementById('wave-wrap');
  waveWrap.className=(d.pumpOn===true)?'wave-wrap pump-on':'wave-wrap';
}

function applySwitch(id,state){
  var btn=document.getElementById(id);
  if(state===null||state===undefined){
    btn.className='toggle-btn hidden';
  } else {
    btn.className='toggle-btn'+(state?' on':'');
  }
}

function toggleSwitch(which){
  var cur=(which==='Bubbles')?_bubblesOn:(which==='Pump')?_pumpOn:_heatingOn;
  if(cur===null)return;
  var next=!cur;
  if(which==='Bubbles')_bubblesOn=next;
  else if(which==='Pump')_pumpOn=next;
  else _heatingOn=next;
  applySwitch(which==='Bubbles'?'btn-bubbles':which==='Pump'?'btn-pump':'btn-heating',next);
  if(which==='Bubbles')document.getElementById('bubbles-wrap').className=next?'bubbles-on':'';
  if(which==='Heating')document.getElementById('heat-arrows-wrap').className=next?'heat-on':'';
  if(which==='Pump'){var ww=document.getElementById('wave-wrap');ww.className=next?'wave-wrap pump-on':'wave-wrap';}
  if(typeof requestAction!=='undefined')requestAction('Set'+which,next?1:0);
}

function adjustTemp(dir){
  if(_targetTemp===null)return;
  var next=Math.round((_targetTemp+dir*_config.step)*10)/10;
  if(next<_config.min||next>_config.max)return;
  _targetTemp=next;
  document.getElementById('sp-val').textContent=next.toFixed(1)+'°';
  if(typeof requestAction!=='undefined')requestAction('SetTargetTemp',next);
}

if(typeof requestAction==='undefined'){
  handleMessage(JSON.stringify({
    name:'Whirlpool', currentTemp:38.5, targetTemp:39.0,
    bubblesOn:true, pumpOn:true, heatingOn:false,
    power:2340, powerUnit:'W', energy:12.5, energyUnit:'kWh',
    config:{min:20, max:42, step:0.5},
    colors:{accent:46296, bubbles:46296, pump:2201331, heating:16739072}
  }));
}
</script>
